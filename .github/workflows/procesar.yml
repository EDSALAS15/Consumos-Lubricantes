name: Procesar Excel → JSON

on:
  push:
    paths:
      - 'Consumosdeaceites.xlsx'   # Se ejecuta solo cuando el Excel cambia
  workflow_dispatch:                # Permite ejecutarlo manualmente desde GitHub

jobs:
  procesar:
    runs-on: ubuntu-latest
    permissions:
      contents: write               # Necesario para hacer commit del JSON

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install openpyxl -q

      - name: Procesar Excel y generar JSON
        run: python procesar_excel.py

      - name: Subir datos.json al repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos.json
          git diff --staged --quiet || git commit -m "⚙️ Auto: actualizar datos.json desde Excel"
          git push
